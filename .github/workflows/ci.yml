name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Leest de pnpm-versie uit packageManager in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      # Alleen productie-afhankelijkheden; faalt pas bij een hoog of kritiek lek.
      - run: pnpm audit --prod --audit-level high

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Bouwt zelf via compose.build.yaml in plaats van het image van GHCR te halen.
    env:
      COMPOSE_FILE: compose.yaml:compose.build.yaml
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker compose build
      # Start met de demodata uit .env.example, zoals compose.yaml dat doet.
      - run: |
          cp .env.example .env
          docker compose up -d --no-build
          for i in $(seq 1 45); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q draai)")" = healthy ] && break
            sleep 2
          done
          docker compose ps
          test "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q draai)")" = healthy
          curl --fail --silent --show-error -o /dev/null http://127.0.0.1:3210/
          curl --fail --silent --show-error http://127.0.0.1:3210/api/health
          test "$(docker compose exec -T draai id -u)" != 0
      - if: always()
        run: docker compose logs draai; docker compose down -v
