version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Nieuwe versies eerst een paar dagen laten liggen; beveiligingsupdates gaan direct.
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    ignore:
      # Types horen bij de Node-versie uit engines (24); die hoog je zelf op.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Kleine updates samen in één PR; grote versiesprongen blijven losse PR's.
      minor-en-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
